<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>freeform typing（試作版）</title>
  </head>
  <body>
    <header class="top">
      <div class="title">freeform typing <span class="tag">試作版</span></div>
      <div class="round">ラウンド <b id="round">1</b></div>
      <div class="gate">
        <div class="bar"><div id="bar-fill"></div></div>
        <div id="gate-text" class="gate-text"></div>
      </div>
      <div class="hands" id="hands" title="このラウンドで送れる残りの文"></div>
    </header>

    <section class="deck-wrap">
      <div class="deck-label">手持ちのルール</div>
      <div id="deck" class="deck"></div>
    </section>

    <main>
      <div class="inputwrap">
        <input id="text" placeholder="好きな日本語の文を打って Enter（漢字に変換してよい）" autocomplete="off" spellcheck="false" />
        <button id="send">送る</button>
      </div>
      <div id="hint" class="hint"></div>
      <div id="next"></div>
      <div id="last" class="last"></div>
      <div id="log" class="log"></div>
    </main>

    <div id="overlay" class="overlay hidden"><div id="overlay-body" class="overlay-body"></div></div>

    <footer>
      <span id="status" class="status"></span>
      <span class="links"><a href="./bench.html">評価のテストベンチ</a> ・ <a href="https://github.com/RyoKaringumi/freeform-typing">GitHub</a></span>
    </footer>

    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
